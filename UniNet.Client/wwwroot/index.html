<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniNet — لوحة الإدارة</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="logo.png" />
    <link href="UniNet.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <svg class="boot-svg" viewBox="0 0 200 200" aria-hidden="true">
                <g class="edges" fill="none" stroke-width="2" stroke-linecap="round">
                    <!-- الذراع الأيسر (أزرق فاتح) -->
                    <line class="edge L" style="--i:0" x1="72" y1="46" x2="86" y2="70" />
                    <line class="edge L" style="--i:1" x1="72" y1="46" x2="55" y2="72" />
                    <line class="edge L" style="--i:2" x1="55" y1="72" x2="86" y2="70" />
                    <line class="edge L" style="--i:3" x1="86" y1="70" x2="48" y2="104" />
                    <line class="edge L" style="--i:4" x1="55" y1="72" x2="48" y2="104" />
                    <line class="edge L" style="--i:5" x1="86" y1="70" x2="82" y2="108" />
                    <line class="edge L" style="--i:6" x1="48" y1="104" x2="82" y2="108" />
                    <line class="edge L" style="--i:7" x1="48" y1="104" x2="74" y2="148" />
                    <line class="edge L" style="--i:8" x1="82" y1="108" x2="74" y2="148" />
                    <!-- الذراع الأيمن (فيروزي) -->
                    <line class="edge R" style="--i:0" x1="128" y1="46" x2="114" y2="70" />
                    <line class="edge R" style="--i:1" x1="128" y1="46" x2="145" y2="72" />
                    <line class="edge R" style="--i:2" x1="145" y1="72" x2="114" y2="70" />
                    <line class="edge R" style="--i:3" x1="114" y1="70" x2="152" y2="104" />
                    <line class="edge R" style="--i:4" x1="145" y1="72" x2="152" y2="104" />
                    <line class="edge R" style="--i:5" x1="114" y1="70" x2="118" y2="108" />
                    <line class="edge R" style="--i:6" x1="152" y1="104" x2="118" y2="108" />
                    <line class="edge R" style="--i:7" x1="152" y1="104" x2="126" y2="148" />
                    <line class="edge R" style="--i:8" x1="118" y1="108" x2="126" y2="148" />
                    <!-- قاعدة الحرف U (جسر) -->
                    <line class="edge R" style="--i:9" x1="74" y1="148" x2="100" y2="164" />
                    <line class="edge R" style="--i:9" x1="126" y1="148" x2="100" y2="164" />
                    <line class="edge R" style="--i:10" x1="74" y1="148" x2="126" y2="148" />
                </g>
                <g class="nodes">
                    <circle class="node L" style="--i:0" cx="72" cy="46" r="7" />
                    <circle class="node L" style="--i:1" cx="86" cy="70" r="6" />
                    <circle class="node L" style="--i:1" cx="55" cy="72" r="5" />
                    <circle class="node L" style="--i:2" cx="48" cy="104" r="6" />
                    <circle class="node L" style="--i:2" cx="82" cy="108" r="8" />
                    <circle class="node L" style="--i:3" cx="74" cy="148" r="6" />
                    <circle class="node R" style="--i:0" cx="128" cy="46" r="7" />
                    <circle class="node R" style="--i:1" cx="114" cy="70" r="6" />
                    <circle class="node R" style="--i:1" cx="145" cy="72" r="5" />
                    <circle class="node R" style="--i:2" cx="152" cy="104" r="6" />
                    <circle class="node R" style="--i:2" cx="118" cy="108" r="8" />
                    <circle class="node R" style="--i:3" cx="126" cy="148" r="6" />
                    <circle class="node R" style="--i:4" cx="100" cy="164" r="7" />
                </g>
            </svg>
            <div class="boot-word">UniNet</div>
            <div class="boot-bar"><span></span></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        حدث خطأ غير متوقّع.
        <a href="." class="reload">إعادة التحميل</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="js/constellation.js"></script>
    <script src="js/uninet.js"></script>
</body>

</html>
